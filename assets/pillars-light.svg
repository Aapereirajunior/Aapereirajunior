<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" fill="none" shape-rendering="geometricPrecision">
  <!-- Container -->
  <rect x="1" y="1" width="898" height="328" rx="6" fill="#F7F6F2" stroke="#E4E2DA" stroke-width="1.5" />

  <!-- Column Dividers -->
  <line x1="306" y1="28" x2="306" y2="302" stroke="#E4E2DA" stroke-width="1" />
  <line x1="594" y1="28" x2="594" y2="302" stroke="#E4E2DA" stroke-width="1" />

  <!-- COLUMN 1: Epidemiology and Climate -->
  <g transform="translate(36, 0)">
    <text x="0" y="44" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11.5" font-weight="700" fill="#0F6E65" letter-spacing="0.6">01 // EPIDEMIOLOGY · CLIMATE</text>
    <text x="0" y="78" font-family="'Newsreader', 'Charter', 'Georgia', serif" font-size="22" font-weight="600" fill="#14171A">Extreme Heat and</text>
    <text x="0" y="106" font-family="'Newsreader', 'Charter', 'Georgia', serif" font-size="22" font-weight="600" fill="#14171A">Envenomations</text>
    <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#3F4750">Non-linear distributed lag models (DLNM)</text>
    <text x="0" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#3F4750">and time-stratified case-crossover on</text>
    <text x="0" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#3F4750">3.6M+ SINAN records in Brazil.</text>

    <!-- Stack Box -->
    <rect x="0" y="224" width="252" height="76" rx="4" fill="#FFFFFF" stroke="#E4E2DA" stroke-width="1" />
    <text x="14" y="252" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" font-weight="600" fill="#0F6E65">R · dlnm · gnm · fixest</text>
    <text x="14" y="276" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" font-weight="600" fill="#0F6E65">DuckDB · Parquet</text>
  </g>

  <!-- COLUMN 2: Primary Care Intelligence -->
  <g transform="translate(324, 0)">
    <text x="0" y="44" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11.5" font-weight="700" fill="#0F6E65" letter-spacing="0.6">02 // PRIMARY CARE INTELLIGENCE</text>
    <text x="0" y="78" font-family="'Newsreader', 'Charter', 'Georgia', serif" font-size="22" font-weight="600" fill="#14171A">Clinical Monitoring</text>
    <text x="0" y="106" font-family="'Newsreader', 'Charter', 'Georgia', serif" font-size="22" font-weight="600" fill="#14171A">and Risk Triage</text>
    <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#3F4750">Risk stratification, care cascades and</text>
    <text x="0" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#3F4750">automated clinical decision support across</text>
    <text x="0" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#3F4750">230+ clinics in Rio de Janeiro.</text>

    <!-- Stack Box -->
    <rect x="0" y="224" width="252" height="76" rx="4" fill="#FFFFFF" stroke="#E4E2DA" stroke-width="1" />
    <text x="14" y="252" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" font-weight="600" fill="#0F6E65">Google BigQuery · SQL</text>
    <text x="14" y="276" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" font-weight="600" fill="#0F6E65">R · Python · Clinical NLP</text>
  </g>

  <!-- COLUMN 3: Regulatory Biostatistics and 3Rs -->
  <g transform="translate(612, 0)">
    <text x="0" y="44" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11.5" font-weight="700" fill="#0F6E65" letter-spacing="0.6">03 // BIOSTATISTICS · 3RS</text>
    <text x="0" y="78" font-family="'Newsreader', 'Charter', 'Georgia', serif" font-size="22" font-weight="600" fill="#14171A">Bioassay Validation</text>
    <text x="0" y="106" font-family="'Newsreader', 'Charter', 'Georgia', serif" font-size="22" font-weight="600" fill="#14171A">and 3Rs Science</text>
    <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#3F4750">Retrospective validation, Probit, Spearman-</text>
    <text x="0" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#3F4750">Kärber and Bland-Altman agreement cutting</text>
    <text x="0" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#3F4750">assay duration under ISO/IEC 17025.</text>

    <!-- Stack Box -->
    <rect x="0" y="224" width="252" height="76" rx="4" fill="#FFFFFF" stroke="#E4E2DA" stroke-width="1" />
    <text x="14" y="252" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" font-weight="600" fill="#0F6E65">R · Shiny · Probit</text>
    <text x="14" y="276" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="13" font-weight="600" fill="#0F6E65">Spearman-Kärber · Lin's CCC</text>
  </g>
</svg>