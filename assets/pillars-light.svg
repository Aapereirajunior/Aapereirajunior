<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" fill="none" shape-rendering="geometricPrecision">
  <!-- Container -->
  <rect x="1" y="1" width="1198" height="208" rx="6" fill="#F7F6F2" stroke="#E4E2DA" stroke-width="1.5" />

  <!-- Column Dividers -->
  <line x1="400" y1="20" x2="400" y2="190" stroke="#E4E2DA" stroke-width="1" />
  <line x1="800" y1="20" x2="800" y2="190" stroke="#E4E2DA" stroke-width="1" />

  <!-- COLUMN 1: Epidemiology and Climate -->
  <g transform="translate(36, 26)">
    <text x="0" y="16" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" font-weight="700" fill="#0F6E65" letter-spacing="0.08em">01 // EPIDEMIOLOGY AND CLIMATE</text>
    <text x="0" y="44" font-family="'Newsreader', 'Charter', 'Georgia', serif" font-size="18" font-weight="600" fill="#14171A">Extreme Heat and Envenomations</text>
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#3F4750">Non-linear distributed lag models (DLNM)</text>
    <text x="0" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#3F4750">and time-stratified case-crossover on</text>
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#3F4750">3.6M+ SINAN records across Brazilian biomes.</text>
    
    <rect x="0" y="128" width="330" height="26" rx="3" fill="#FFFFFF" stroke="#E4E2DA" stroke-width="1" />
    <text x="10" y="145" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10" font-weight="500" fill="#0F6E65">R · dlnm · gnm · fixest · DuckDB · Parquet</text>
  </g>

  <!-- COLUMN 2: Primary Care Intelligence -->
  <g transform="translate(436, 26)">
    <text x="0" y="16" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" font-weight="700" fill="#0F6E65" letter-spacing="0.08em">02 // PRIMARY CARE INTELLIGENCE</text>
    <text x="0" y="44" font-family="'Newsreader', 'Charter', 'Georgia', serif" font-size="18" font-weight="600" fill="#14171A">Clinical Monitoring and Risk Triage</text>
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#3F4750">Risk stratification, care cascades and</text>
    <text x="0" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#3F4750">automated clinical decision support across</text>
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#3F4750">230+ clinics and millions of patient encounters.</text>
    
    <rect x="0" y="128" width="330" height="26" rx="3" fill="#FFFFFF" stroke="#E4E2DA" stroke-width="1" />
    <text x="10" y="145" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10" font-weight="500" fill="#0F6E65">Google BigQuery · SQL · dbt · Python · Quarto</text>
  </g>

  <!-- COLUMN 3: Regulatory Biostatistics and 3Rs -->
  <g transform="translate(836, 26)">
    <text x="0" y="16" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" font-weight="700" fill="#0F6E65" letter-spacing="0.08em">03 // REGULATORY BIOSTATISTICS AND 3RS</text>
    <text x="0" y="44" font-family="'Newsreader', 'Charter', 'Georgia', serif" font-size="18" font-weight="600" fill="#14171A">Bioassay Validation and 3Rs Science</text>
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#3F4750">Retrospective validation, Probit, Spearman-</text>
    <text x="0" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#3F4750">Kärber and Bland-Altman agreement cutting</text>
    <text x="0" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#3F4750">animal testing time and distress under 17025.</text>
    
    <rect x="0" y="128" width="330" height="26" rx="3" fill="#FFFFFF" stroke="#E4E2DA" stroke-width="1" />
    <text x="10" y="145" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10" font-weight="500" fill="#0F6E65">R · Shiny · Bland-Altman · Probit · Bootstrap</text>
  </g>
</svg>