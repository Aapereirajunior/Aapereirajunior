<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="aa-grad-light" x1="10.5" y1="17.5" x2="37.5" y2="17.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14171A" />
      <stop offset="100%" stop-color="#0F6E65" />
    </linearGradient>
    <linearGradient id="dlnm-ribbon-light" x1="770" y1="75" x2="1110" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F6E65" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#0F6E65" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="1198" height="238" rx="6" fill="#F7F6F2" stroke="#E4E2DA" stroke-width="1.5" />

  <!-- LEFT COLUMN: Identity and Monogram -->
  <g transform="translate(48, 38)">
    <!-- Monogram AA (viewBox 0 0 48 30 scaled 1.5) -->
    <g transform="scale(1.5)">
      <path d="M 3 25 C 10 25, 13.5 5, 19 5 C 24.5 5, 28 25, 35 25" stroke="#14171A" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <path d="M 45 25 C 38 25, 34.5 5, 29 5 C 23.5 5, 20 25, 13 25" stroke="#0F6E65" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <path d="M 24 17.5 L 10.5 17.5" stroke="url(#aa-grad-light)" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <path d="M 24 17.5 L 37.5 17.5" stroke="url(#aa-grad-light)" stroke-width="1.8" stroke-linecap="round" fill="none" />
    </g>

    <!-- Brand signature -->
    <text x="86" y="24" font-family="'Newsreader', 'Charter', 'Georgia', serif" font-size="21" font-weight="600" fill="#14171A" letter-spacing="-0.01em">AAPJ<tspan font-family="'JetBrains Mono', 'Consolas', monospace" font-size="17" font-weight="600" fill="#0F6E65">.dev</tspan></text>
    <text x="86" y="41" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10.5" font-weight="500" fill="#76808A" letter-spacing="0.08em">EDITORIAL HEALTH DATA SCIENCE</text>

    <!-- Full Author Title -->
    <text x="0" y="88" font-family="'Newsreader', 'Charter', 'Georgia', serif" font-size="30" font-weight="500" fill="#14171A" letter-spacing="-0.02em">Antonio Alves Pereira Júnior</text>
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="500" fill="#0F6E65">Health Data Scientist and Public Health Specialist</text>

    <!-- Hairline Separator -->
    <line x1="0" y1="136" x2="600" y2="136" stroke="#E4E2DA" stroke-width="1" />

    <!-- Metadata Line -->
    <text x="0" y="156" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11.5" font-weight="500" fill="#525B65" letter-spacing="0.02em">Rio de Janeiro, BR · NIA / SMS-Rio · ENSP / Fiocruz · UNIFESP</text>
  </g>

  <!-- RIGHT COLUMN: Nature-Style DLNM Exposure-Response Card -->
  <g transform="translate(710, 28)">
    <rect x="0" y="0" width="442" height="182" rx="4" fill="#FFFFFF" stroke="#E4E2DA" stroke-width="1" />

    <!-- Graph Header -->
    <text x="18" y="23" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10.5" font-weight="600" fill="#0F6E65" letter-spacing="0.06em">NON-LINEAR RELATIVE RISK // DLNM</text>
    <text x="424" y="23" text-anchor="end" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="10" fill="#76808A">3.6M+ SINAN RECORDS</text>
    <line x1="18" y1="32" x2="424" y2="32" stroke="#F0EFEA" stroke-width="1" />

    <!-- Graph Plot Area: Reference line RR = 1.0 at y = 115 -->
    <line x1="35" y1="115" x2="405" y2="115" stroke="#C84B31" stroke-width="1" stroke-dasharray="3,3" opacity="0.75" />
    <text x="408" y="118" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="9" fill="#C84B31" font-weight="600">RR 1.0</text>

    <!-- 95% Confidence Interval Ribbon Fill -->
    <path d="M 35 125 C 80 120, 150 108, 180 105 C 220 102, 270 95, 320 72 C 355 56, 385 45, 405 40 L 405 68 C 385 75, 355 88, 320 102 C 270 122, 220 128, 180 128 C 150 128, 80 134, 35 138 Z" fill="url(#dlnm-ribbon-light)" />

    <!-- Main Estimate Curve (Non-linear J-shaped curve) -->
    <path d="M 35 131 C 80 127, 150 118, 180 115 C 220 112, 270 106, 320 86 C 355 70, 385 58, 405 52" stroke="#0F6E65" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Minimum Morbidity Temperature (MMT) marker -->
    <line x1="180" y1="115" x2="180" y2="148" stroke="#76808A" stroke-width="1" stroke-dasharray="2,2" />
    <circle cx="180" cy="115" r="3" fill="#0F6E65" />

    <!-- Extreme Heat Point Marker -->
    <circle cx="375" cy="62" r="3.5" fill="#C84B31" />
    <text x="375" y="50" text-anchor="middle" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="9" font-weight="600" fill="#C84B31">Heatwave Lag 0-3</text>

    <!-- Axes Bottom -->
    <line x1="35" y1="148" x2="405" y2="148" stroke="#E4E2DA" stroke-width="1" />
    <text x="35" y="164" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="9" fill="#76808A">10°C</text>
    <text x="180" y="164" text-anchor="middle" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="9" font-weight="500" fill="#0F6E65">MMT (23°C)</text>
    <text x="375" y="164" text-anchor="middle" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="9" fill="#76808A">38°C (Extreme)</text>
    <text x="405" y="164" text-anchor="end" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="9" fill="#76808A">42°C</text>
  </g>
</svg>