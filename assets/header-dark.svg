<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 235" width="900" height="235" fill="none" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="aa-grad-dark" x1="10.5" y1="17.5" x2="37.5" y2="17.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7F6F2" />
      <stop offset="100%" stop-color="#3FB6A8" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="898" height="233" rx="6" fill="#0D1117" stroke="#30363D" stroke-width="1.5" />

  <!-- TOP BAR: Monogram + Brand Centered as a Group around x=450 -->
  <g transform="translate(346, 24)">
    <!-- Monogram AA (viewBox 0 0 48 30 scaled 1.35) -->
    <g transform="scale(1.35)">
      <path d="M 3 25 C 10 25, 13.5 5, 19 5 C 24.5 5, 28 25, 35 25" stroke="#F7F6F2" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <path d="M 45 25 C 38 25, 34.5 5, 29 5 C 23.5 5, 20 25, 13 25" stroke="#3FB6A8" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <path d="M 24 17.5 L 10.5 17.5" stroke="url(#aa-grad-dark)" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <path d="M 24 17.5 L 37.5 17.5" stroke="url(#aa-grad-dark)" stroke-width="1.8" stroke-linecap="round" fill="none" />
    </g>

    <!-- Brand signature -->
    <text x="78" y="29" font-family="'Newsreader', 'Charter', 'Georgia', serif" font-size="28" font-weight="600" fill="#F7F6F2" letter-spacing="-0.01em">AAPJ<tspan font-family="'JetBrains Mono', 'Consolas', monospace" font-size="22" font-weight="600" fill="#3FB6A8">.dev</tspan></text>
  </g>

  <!-- AUTHOR NAME (Centered) -->
  <text x="450" y="118" text-anchor="middle" font-family="'Newsreader', 'Charter', 'Georgia', serif" font-size="42" font-weight="500" fill="#F7F6F2" letter-spacing="-0.02em">Antonio Alves Pereira Júnior</text>

  <!-- ROLE / TITLE (Centered) -->
  <text x="450" y="154" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#3FB6A8">Health Data Scientist and Public Health Specialist</text>

  <!-- HAIRLINE DIVIDER (Centered) -->
  <line x1="120" y1="180" x2="780" y2="180" stroke="#30363D" stroke-width="1" />

  <!-- INSTITUTIONAL FOOTER (Centered) -->
  <text x="450" y="208" text-anchor="middle" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="14" font-weight="500" fill="#8B949E" letter-spacing="0.02em">Rio de Janeiro, BR  ·  NIA / SMS-Rio  ·  ENSP / Fiocruz  ·  UNIFESP</text>
</svg>