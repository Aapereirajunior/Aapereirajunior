# SciForge v2 — configuração global.
# Um projeto pode sobrescrever qualquer chave criando <projeto>/01_estado/settings.override.yaml

idioma: pt-BR               # pt-BR | en (idioma do manuscrito; regras_revista.txt tem prioridade)
csl_padrao: vancouver       # vancouver | abnt | <nome de qualquer estilo do repositório citation-style-language/styles>

# Onde roda a INFERÊNCIA de IA (o R e as proteções LGPD rodam sempre localmente, em qualquer modo):
# cloud  (padrão): todas as fases usam modelos em nuvem (Gemini/Claude/OpenRouter). Os modelos recebem
#          apenas agregados: perfil com supressão de células < 5, código R, logs sanitizados e resultados.
# hybrid : opcional — Fases 1 e 4 no Ollama local; demais fases na nuvem.
# strict : opcional — todas as chamadas no Ollama local (nenhum texto sai da máquina).
privacy_mode: cloud

llm:
  providers:
    gemini:
      kind: gemini
      api_key_env: GEMINI_API_KEY
      base_url: https://generativelanguage.googleapis.com/v1beta
      timeout_s: 180
    claude:                       # API direta da Anthropic, via SDK oficial `anthropic`
      kind: anthropic
      api_key_env: ANTHROPIC_API_KEY
      effort: high                # low | medium | high | xhigh | max (controla a profundidade de raciocínio)
      fallbacks: default          # reexecuta recusas em outro modelo no servidor; null desativa
      timeout_s: 600
    openai:
      kind: openai
      api_key_env: OPENAI_API_KEY
      base_url_env: OPENAI_BASE_URL
      base_url: https://api.openai.com/v1
      timeout_s: 180
    openrouter:                   # um endpoint, centenas de modelos (slugs em https://openrouter.ai/models)
      kind: openrouter
      api_key_env: OPENROUTER_API_KEY
      base_url: https://openrouter.ai/api/v1
      timeout_s: 300
      extra_headers:
        X-Title: SciForge
    ollama:
      kind: ollama
      host_env: OLLAMA_HOST
      base_url: http://localhost:11434
      timeout_s: 900
      num_ctx: 8192               # contexto; suba para 16384-32768 se tiver ≥ 12 GB de VRAM (ou SCIFORGE_OLLAMA_NUM_CTX)
      local: true

  # Papéis globais (usados quando a fase não define o papel em `phases`).
  # "local"/"local_vision" atendem as chamadas forçadas ao modelo local pelo privacy_mode.
  roles:
    default:      { provider: gemini, model: gemini-2.5-pro }
    fast:         { provider: gemini, model: gemini-2.5-flash }
    vision:       { provider: gemini, model: gemini-2.5-flash }
    writer:       { provider: claude, model: claude-opus-5-5 }
    analyst:      { provider: claude, model: claude-opus-5-5 }   # Fase 4: escreve e corrige os scripts R
    reviewer:     { provider: openrouter, model: openai/gpt-4.1 }
    # Opcionais (usados só em privacy_mode hybrid/strict). Padrão leve para GPUs de 4-8 GB de VRAM;
    # troque pelo .env sem editar este arquivo:
    #   SCIFORGE_OLLAMA_MODEL=qwen2.5-coder:14b        (≥ 12 GB)  ·  qwen2.5-coder:32b (≥ 24 GB)
    #   SCIFORGE_OLLAMA_VISION_MODEL=qwen2.5vl:7b      (≥ 8 GB)
    local:        { provider: ollama, model: "qwen2.5-coder:7b", model_env: SCIFORGE_OLLAMA_MODEL }
    local_vision: { provider: ollama, model: "qwen2.5vl:3b", model_env: SCIFORGE_OLLAMA_VISION_MODEL }

  # Roteamento por fase (prioridade sobre `roles`). Ordem de resolução:
  #   phases.<fase>.<papel>  →  phases.<fase>."*"  →  roles.<papel>  →  roles.default
  # Padrão 100% nuvem. Só se você optar por privacy_mode hybrid/strict é que as Fases 1 e 4 passam a usar
  # roles.local/local_vision (ou phases.<fase>.local, que também precisa ser um provedor local).
  phases:
    phase1:                       # desconstrução + leitura dos gráficos preliminares
      "*":    { provider: gemini, model: gemini-2.5-pro }
      vision: { provider: gemini, model: gemini-2.5-flash }
    phase2:                       # enxame de literatura e fichamento
      "*":    { provider: gemini, model: gemini-2.5-pro }
      fast:   { provider: gemini, model: gemini-2.5-flash }
    phase3:                       # Arquiteto (Claude) atacado por um Revisor #2 de outra família de modelos
      "*":      { provider: claude, model: claude-opus-5-5 }
      reviewer: { provider: openrouter, model: openai/gpt-4.1 }
    phase4:                       # Claude escreve/corrige o R (executado localmente); QA visual com Gemini
      "*":     { provider: claude, model: claude-opus-5-5 }
      analyst: { provider: claude, model: claude-opus-5-5 }
      vision:  { provider: gemini, model: gemini-2.5-flash }
    phase5:
      "*":    { provider: claude, model: claude-opus-5-5 }
    phase6:
      "*":      { provider: claude, model: claude-opus-5-5 }
      fast:     { provider: gemini, model: gemini-2.5-flash }     # juiz de citações e checklist
      reviewer: { provider: openrouter, model: openai/gpt-4.1 }

  # Preço em USD por 1M tokens (entrada, saída). Modelos locais custam 0.
  # Modelos via OpenRouter usam o slug como chave (ex.: "openai/gpt-4.1").
  pricing:
    gemini-2.5-pro:   [1.25, 10.0]
    gemini-2.5-flash: [0.30, 2.50]
    claude-opus-5-5:  [4.00, 20.0]
    claude-sonnet-5-5: [2.00, 10.0]
    claude-haiku-5-5: [0.10, 0.50]
    gpt-4.1:          [2.00, 8.00]
    gpt-4.1-mini:     [0.40, 1.60]
    openai/gpt-4.1:   [2.00, 8.00]
  temperature: 0.3              # ignorado pelo provedor Claude (os modelos atuais não aceitam temperature)
  max_output_tokens: 8192

# Trava 8 — disjuntor de custo
budget:
  global_max_cost_usd: 25.0
  phases:
    phase1: { max_tokens: 200000,  max_cost_usd: 2.0, max_calls: 30 }
    phase2: { max_tokens: 1500000, max_cost_usd: 6.0, max_calls: 120 }
    phase3: { max_tokens: 400000,  max_cost_usd: 3.0, max_calls: 20 }
    phase4: { max_tokens: 1200000, max_cost_usd: 5.0, max_calls: 80 }
    phase5: { max_tokens: 200000,  max_cost_usd: 2.0, max_calls: 10 }
    phase6: { max_tokens: 1500000, max_cost_usd: 7.0, max_calls: 120 }
  limits:
    r_script_max_retries: 4
    figure_qa_max_cycles: 2
    reviewer_max_rounds: 2
    firewall_regen_max: 2

literature:
  per_source_max: 40
  years_back_state_of_art: 5
  final_pool_max: 60
  rate_limits_rps:          # requisições por segundo por fonte
    openalex: 8
    europepmc: 5
    crossref: 5
    semanticscholar: 0.9
  max_retries: 5
  backoff_base_s: 1.5
  semantic_scholar_bulk: false              # true força /paper/search/bulk (usado automaticamente se > 100 resultados)
  semantic_scholar_retries_without_key: 1   # sem SEMANTIC_SCHOLAR_API_KEY, desiste rápido em 429 (fallback silencioso)
  semantic_scholar_rps_with_key: 1.0        # limite padrão de chaves gratuitas: 1 req/s
  fetch_open_access_fulltext: true
  fulltext_max_chars: 12000

analysis:
  use_renv: true
  rscript_timeout_s: 1800
  r_packages: [tidyverse, gtsummary, gt, flextable, ggplot2, jsonlite, broom, arrow, data.table, fst, viridisLite, svglite]
  max_unexplained_sample_loss: 0.20   # perda amostral > 20% exige justificativa explícita no fluxo
  figure_min_dpi: 300

integrity:
  draft_ngram_n: 6
  draft_recycled_sentence_containment: 0.5
  draft_max_recycled_ratio: 0.10
  firewall_ngram_n: 10                # n-grama usado para detectar vazamento do rascunho em prompts
  firewall_max_shared_ngrams: 2
  plagiarism_ngram_n: 6
  plagiarism_containment_alert: 0.35
  citation_support_min_score: 0.12
  numeric_relative_tolerance: 0.005

render:
  formats: [docx, pdf]
  reference_doc: null       # caminho opcional para template .docx
