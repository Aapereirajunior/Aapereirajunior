[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sciforge"
version = "2.0.0"
description = "SciForge v2 — R/Quarto Edition: sistema multi-agente de reconstrução e redação científica epidemiológica"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
pdf = ["pypdf>=4.0"]

[project.scripts]
sciforge = "sciforge.orchestrator:main"
sciforge-mcp = "sciforge.mcp_server.server:main"

[tool.setuptools]
package-dir = { "sciforge" = "src" }
packages = [
  "sciforge",
  "sciforge.core",
  "sciforge.tools",
  "sciforge.agents",
  "sciforge.mcp_server",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: testes que acessam APIs públicas reais (ative com SCIFORGE_RUN_INTEGRATION=1)",
  "requires_r: testes que exigem Rscript no PATH",
]
